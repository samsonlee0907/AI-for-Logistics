<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Logistics AI Control Tower</title>
    <meta name="description" content="Secure sign-in for the Logistics AI Control Tower.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">L</div>
        <p class="eyebrow">Restricted client portal</p>
        <h1 id="login-title">Logistics AI<br>Control Tower</h1>
        <p class="intro">Sign in to access the synthetic decision demonstrations and advisory intelligence workspace.</p>
        <form id="loginForm">
          <label>Username<input id="username" name="username" autocomplete="username" required autofocus></label>
          <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
          <p id="loginError" class="error" role="alert"></p>
          <button class="button" type="submit">Sign in</button>
        </form>
        <p class="notice">Access is logged by the hosting platform. This portal contains synthetic demonstration data only.</p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
